[package]
name = "glyphsift-cli"
description = "Command-line front end for glyphsift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "glyphsift"
path = "src/main.rs"
# The bin `glyphsift` and the lib `glyphsift` of glyphsift-py would both write target/doc/glyphsift/index.html, and cargo
# warns "output filename collision" (cargo issue 6313): one crate's rendered docs overwrote the other's (BUG-T2-S5-08).
# A command-line binary has no public API to document; the library docs (glyphsift-core, glyphsift-py, glyphsift-wasm)
# are all rendered and `RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked` checks them.
doc = false

[dependencies]
clap.workspace = true
glyphsift-core = { workspace = true, features = ["corrupt"] }
serde_json.workspace = true
