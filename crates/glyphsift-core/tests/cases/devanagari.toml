# Tests-first case table for the Devanagari grapheme-cluster validator (lands in Sprint 2).
#
# Each case gives the input, the expected UAX #29 extended grapheme clusters (unicode-segmentation
# 1.13.x, Unicode 15.1 GB9c conjunct rule included) and the expected issues as {kind, cluster}.
# Rule definitions and code-point tables: docs/devanagari-rules.md. Every IssueKind name appears at
# least once. Inputs are synthetic; invisible marks are written as \uXXXX escapes so the file can be
# read without a Devanagari-aware editor.
#
# Harness: tests/devanagari.rs. The non-ignored tests check that this table parses, covers every
# kind and that the expected clusters are what the segmenter produces; the #[ignore]d test runs the
# validator over every case.

# ---------------------------------------------------------------------------------------------
# Valid text: no issues
# ---------------------------------------------------------------------------------------------

[[case]]
name = "empty"
input = ""
clusters = []
issues = []

[[case]]
name = "latin_only"
input = "hello world"
clusters = ["h", "e", "l", "l", "o", " ", "w", "o", "r", "l", "d"]
issues = []
note = "Latin letters with no Devanagari marks are standalone clusters; nothing to flag at cluster level"

[[case]]
name = "namaste_danda"
input = "नमस्ते।"
clusters = ["न", "म", "स्ते", "।"]
issues = []
note = "danda U+0964 is its own cluster; the conjunct s+virama+t+e is one cluster (GB9c)"

[[case]]
name = "ksha_conjunct"
input = "क्ष"
clusters = ["क्ष"]
issues = []

[[case]]
name = "ksha_dead"
input = "क्ष्"
