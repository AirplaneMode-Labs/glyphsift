# ---------------------------------------------------------------------------------------------
# BUG-T2-S2-15: tag characters and non-Indic combining marks in Devanagari clusters.
# Tag characters (U+E0001, U+E0020..U+E007F) in a Devanagari-based cluster, or starting a cluster, are unexpected_code_point.
# A combining mark (Mn, Mc, Me) on a Devanagari-class base that is outside Devanagari, Devanagari Extended, Devanagari Extended-A,
# Vedic Extensions, and is not a variation selector, is mixed_script_in_cluster (rule 14). Latin, emoji and other clusters are untouched.
# ---------------------------------------------------------------------------------------------

