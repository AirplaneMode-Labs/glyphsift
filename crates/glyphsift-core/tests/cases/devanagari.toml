input = "क्‍"
clusters = ["क्‍"]
issues = []
note = "ZWJ directly after virama requests the half form; valid even at the end"

[[case]]
name = "eyelash_reph"
input = "र्‍य"
clusters = ["र्‍य"]
issues = []
note = "ra + virama + ZWJ is the Marathi eyelash reph; valid"

[[case]]
name = "zwnj_after_virama"
input = "क्‌ष"
clusters = ["क्‌", "ष"]
issues = []
note = "ZWNJ after virama blocks the conjunct; UAX #29 then breaks before the next consonant"

