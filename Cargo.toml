[workspace]
resolver = "3"
members = [
    "crates/glyphsift-core",
    "crates/glyphsift-cli",
    "crates/glyphsift-py",
    "crates/glyphsift-wasm",
]
# The PyO3 and wasm-bindgen crates need their own build drivers (maturin, wasm-bindgen CLI),
# so a plain `cargo build` / `cargo test` only touches core + cli.
default-members = ["crates/glyphsift-core", "crates/glyphsift-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AirplaneMode-Labs/glyphsift"
homepage = "https://github.com/AirplaneMode-Labs/glyphsift"
readme = "README.md"
keywords = ["devanagari", "unicode", "grapheme", "data-quality", "wasm"]
categories = ["text-processing", "internationalization"]
rust-version = "1.98"

[workspace.dependencies]
glyphsift-core = { path = "crates/glyphsift-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
# Never `preserve_order`: canonical JSON relies on fixed struct order and BTreeMap sorting.
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
# General_Category lookups (unassigned code points, other-script letters, Indic combining marks).
# no_std, Apache-2.0, no dependencies; Unicode 16.0 tables, compiled in, so native, Python and WASM agree.
unicode-general-category = "1.1.0"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.8"

# Native release: speed matters, and PyO3 needs unwinding to turn a Rust panic into a Python
# exception, so no `panic = "abort"` here.
[profile.release]
lto = "thin"
codegen-units = 1

# Browser build, size-optimised. Used via `scripts/build-wasm.sh`.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true
