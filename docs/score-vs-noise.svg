<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Document score versus synthetic OCR noise</title>
<desc id="d">Line chart of the document score against the noise level p, for p = 0 to 0.4. The mixed family&apos;s mean over the seeds falls from 1.0000 at p = 0 to 0.9324 at p = 0.4. The 12 triggering families each fall as p rises. The 7 none-directly families end between 1.0000 and 1.0000 at p = 0.4. The data is in docs/score-vs-noise.csv.</desc>
<rect x="0" y="0" width="960" height="540" fill="#fcfcfb"/>
<rect x="1" y="1" width="958" height="538" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<text x="40" y="40" font-size="18" font-weight="600" fill="#0b0b0b">Document score versus synthetic OCR noise</text>
<text x="40" y="62" font-size="12" fill="#52514e">Synthetic Hindi and Marathi corpus, seeds 1 to 3. A score of 1 is clean; each step corrupts a larger share of eligible sites.</text>
<rect x="40" y="88" width="24" height="12" fill="#dde8f5"/>
<line x1="40" y1="94" x2="64" y2="94" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="72" y="98" font-size="12" fill="#52514e">Mixed: mean of seeds, band is min to max</text>
<line x1="360" y1="94" x2="384" y2="94" stroke="#898781" stroke-width="1"/>
<text x="392" y="98" font-size="12" fill="#52514e">12 triggering families (seed mean)</text>
<line x1="640" y1="94" x2="664" y2="94" stroke="#898781" stroke-width="1" stroke-dasharray="4 3"/>
<text x="672" y="98" font-size="12" fill="#52514e">7 none-directly families</text>
<text x="40" y="116" font-size="12" fill="#52514e">Score (1 = clean); the axis starts at 0.6</text>
<line x1="100" y1="440" x2="880" y2="440" stroke="#c3c2b7" stroke-width="1"/>
<text x="92" y="444" font-size="12" text-anchor="end" fill="#52514e">0.6</text>
<line x1="100" y1="362" x2="880" y2="362" stroke="#e1e0d9" stroke-width="1"/>
<text x="92" y="366" font-size="12" text-anchor="end" fill="#52514e">0.7</text>
