name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: fmt, clippy, test, wasm32, pyo3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Default members: core + cli. Includes the tests-first case table checks.
      - run: cargo test
      - name: Ignored Sprint 2 harness must still compile (not run)
        run: cargo test -p glyphsift-core --test devanagari --no-run
      - run: cargo check -p glyphsift-core --target wasm32-unknown-unknown
      - run: cargo check -p glyphsift-wasm --target wasm32-unknown-unknown
      - run: cargo check -p glyphsift-py
      - name: Licence sweep (copyleft must not appear)
        run: |
          if cargo tree --workspace -e normal -f '{p} {l}' | grep -Ei 'GPL|AGPL|LGPL|SSPL'; then
            echo "copyleft licence found in the dependency tree" >&2; exit 1; fi
          if cargo tree --workspace -f '{p} {f}' | grep preserve_order; then
            echo "serde_json preserve_order must stay off" >&2; exit 1; fi

  # Builds the GitHub Pages demo with the same commands .github/workflows/pages.yml runs, so a demo
  # that fails to build fails CI.
  demo:
    name: demo build (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned wasm-bindgen CLI and wasm-opt (digest-pinned release binaries)
        run: scripts/install-wasm-tools.sh
      - run: scripts/build-demo.sh
