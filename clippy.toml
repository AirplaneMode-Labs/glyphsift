# Determinism rule: native, Python and WASM builds must produce byte-identical JSON for the same
# input. Hash-based collections iterate in a per-process random order, and the transcendental
# functions below are delegated to the platform libm (glibc, Apple libm, wasm compiler-builtins),
# which can differ in the last ulp. glyphsift-core uses BTreeMap/BTreeSet and integer arithmetic;
# if a float score ever needs exp/ln/pow, add the pure-Rust `libm` crate and wrap it, as pagetriage
# does in `pagetriage_core::math`.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is randomised per process; use BTreeMap so output is reproducible" },
    { path = "std::collections::HashSet", reason = "iteration order is randomised per process; use BTreeSet so output is reproducible" },
]

disallowed-methods = [
    { path = "f64::exp", reason = "platform libm is not bit-reproducible; use the pure-Rust libm crate" },
    { path = "f64::exp2", reason = "platform libm is not bit-reproducible; use the pure-Rust libm crate" },
    { path = "f64::exp_m1", reason = "platform libm is not bit-reproducible" },
    { path = "f64::ln", reason = "platform libm is not bit-reproducible; use the pure-Rust libm crate" },
    { path = "f64::ln_1p", reason = "platform libm is not bit-reproducible" },
    { path = "f64::log", reason = "platform libm is not bit-reproducible; use the pure-Rust libm crate" },
    { path = "f64::log2", reason = "platform libm is not bit-reproducible; use the pure-Rust libm crate" },
    { path = "f64::log10", reason = "platform libm is not bit-reproducible; use the pure-Rust libm crate" },
    { path = "f64::powf", reason = "platform libm is not bit-reproducible; use the pure-Rust libm crate" },
    { path = "f64::powi", reason = "compiler-rt powi differs per target" },
    { path = "f64::sin", reason = "platform libm is not bit-reproducible" },
    { path = "f64::cos", reason = "platform libm is not bit-reproducible" },
    { path = "f64::tan", reason = "platform libm is not bit-reproducible" },
    { path = "f64::asin", reason = "platform libm is not bit-reproducible" },
    { path = "f64::acos", reason = "platform libm is not bit-reproducible" },
    { path = "f64::atan", reason = "platform libm is not bit-reproducible" },
    { path = "f64::atan2", reason = "platform libm is not bit-reproducible" },
    { path = "f64::sinh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::cosh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::tanh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::cbrt", reason = "platform libm is not bit-reproducible" },
    { path = "f64::hypot", reason = "platform libm is not bit-reproducible" },
]
